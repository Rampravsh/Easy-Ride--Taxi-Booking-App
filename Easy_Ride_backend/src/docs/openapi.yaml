openapi: 3.1.0
info:
  title: Easy Ride API
  version: 1.0.0
  description: Enterprise-grade backend for real-time ride-booking.
  contact:
    name: Engineering Team
    email: support@easyride.com

servers:
  - url: /api/v1
    description: Current Version

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
        data:
          type: object

    RideEstimate:
      type: object
      properties:
        pickupCoordinates:
          type: array
          items: { type: number }
        dropCoordinates:
          type: array
          items: { type: number }
        rideType:
          type: string
          enum: [bike, car, auto, luxury]

paths:
  /auth/firebase:
    post:
      summary: Firebase Authentication
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, role]
              properties:
                token: { type: string }
                role: { type: string, enum: [user, rider, admin] }
      responses:
        200:
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /rides/estimate:
    post:
      summary: Get fare estimate
      tags: [Rides]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RideEstimate' }
      responses:
        200:
          description: OK

  /rides/book:
    post:
      summary: Book a ride
      tags: [Rides]
      security:
        - bearerAuth: []
      responses:
        201:
          description: Ride Created

  /rides/{rideId}/accept:
    put:
      summary: Accept ride (Rider only)
      tags: [Rides]
      parameters:
        - name: rideId
          in: path
          required: true
          schema: { type: string }
      security:
        - bearerAuth: []
      responses:
        200:
          description: Ride Accepted
